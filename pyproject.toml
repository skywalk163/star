[project]
name = "star"
version = "0.1.0"
description = "群星 Star - AI Agent 调度中心"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Star Team" }
]

dependencies = [
    "pywin32>=306",
    "psutil>=5.9.8",
    "uiautomation>=2.0.8",
    "pyperclip>=1.8.2",
    "pyautogui>=0.9.54",
    "loguru>=0.7.2",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "pydantic>=2.6.0",
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[project.scripts]
star = "star_core.cli:main"

[project.gui-scripts]
star-gui = "star_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["star_core", "star_api", "star_plugins"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
