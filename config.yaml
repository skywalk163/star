auth:
  api_keys:
  - key: star-admin-key
    name: 管理员密钥
    role: admin
  - key: star-viewer-key
    name: 只读密钥
    role: viewer
  enabled: true
  header_name: X-API-Key
cdp:
  port: 9222
  profile: ~/.star/browser-profile
  url_pattern: ""
directories:
  data: data
  logs: logs
  plugins: star_plugins
emissary:
  default_wait_timeout: 60
  response_poll_interval: 1.0
logging:
  compression: zip
  retention: 30 days
  rotation: 100 MB
ocr:
  change_threshold: 0.01
  det_limit_side_len: 960
  enabled: false
  lang: ch
  min_confidence: 0.5
  use_gpu: false
  use_incremental: true
server:
  host: 0.0.0.0
  log_level: INFO
  name: 群星 Star API
  port: 8765
  reload: false
  workers: 1
websocket:
  heartbeat_interval: 15
  max_clients_per_star: 10
  ocr_broadcast_interval: 3
