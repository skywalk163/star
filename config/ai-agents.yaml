# ========== 默认适配器配置模板 ==========
# 当 agent 中没有 adapter_config 时使用这些默认值

default_adapter_config:
  input_click_x_ratio: 0.5
  input_click_y_ratio: 0.93
  output_region: center_chat
  completion_strategy: STATUS_KEYWORD
  completion_keywords:
    - 重新生成
    - 复制
    - 清空
    - 发送
    - 已收到
  running_keywords:
    - 思考中
    - 生成中
    - 处理中
    - 正在思考
    - 正在生成
  stable_count: 2
  check_interval: 2.5
  timeout: 300.0
  ocr_lang: ch
