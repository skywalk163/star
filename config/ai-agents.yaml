# AI Agent 特征配置文件
# 用于群星 Star 系统识别和交互 AI Agent
# 
# 如何添加新 Agent：
# 1. 在 agents 列表中添加新的配置
# 2. 填写必填字段（id, name, vendor, category, process_names, title_patterns）
# 3. 可选字段有默认值
# 4. 运行测试验证

version: "1.0"
generated: "2026-06-30"

agents:
  # ========== IDE 类 AI Agent ==========
  
  - id: trae
    name: Trae AI
    vendor: 字节跳动
    description: 字节跳动 AI 编程助手（Trae Solo / Trae CN）
    category: ide
    process_names:
      - Trae.exe
      - trae.exe
      - Trae CN.exe
      - Trae CN
      - TRAE SOLO CN.exe
      - TRAE SOLO CN
    window_class:
      - Chrome_WidgetWin_1
      - MozillaWindowClass
    title_patterns:
      - Trae
      - trae
      - TRAE Work CN
      - TRAE SOLO
      - Trae CN
    title_format:
      pattern: "{filename} - {project} - Trae CN"
      examples:
        - "hanoi.duan - duan - Trae CN"
        - "setup-redis.sh - sound - Trae CN"
        - "TRAE Work CN.0.1.23.no_sid.no_ppe.T(2026/6/29 00:05:54)"
    window_types:
      editor: [".py", ".js", ".ts", ".java", ".duan", ".sh", ".go", ".rs"]
      document: [".md", ".txt", ".docx", ".pdf", ".html"]
      preview: "(Preview)"
      work_mode: "TRAE Work"
    interaction:
      input:
        locators: [uia, visual, ratio]
        uia:
          control_type: Edit
          name_pattern: "输入|Ask|Message"
        visual:
          hint_text: "输入"
        ratio:
          x: 0.5
          y: 0.93
        send_on: Enter
      stop:
        fallback_keys:
          - Esc
      output:
        - type: log
          paths:
            - "~/.trae-cn/log/**/*.log"

  - id: codearts_agent
    name: CodeArts Agent
    vendor: 华为云
    description: 华为云 CodeArts Agent AI 编程助手
    category: ide
    process_names:
      - codearts-agent.exe
      - CodeArts Agent.exe
    window_class:
      - Chrome_WidgetWin_1
    title_patterns:
      - CodeArts Agent
      - codearts agent
    title_format:
      pattern: "{project} - {filename} - CodeArts Agent"
      examples:
        - "yanpub - adapter.py - CodeArts Agent"
        - "zhixing - _test_friendly.py - CodeArts Agent"

  - id: codearts_atomcode
