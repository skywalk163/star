    title_patterns:
      - 文心一言
      - yiyan
    cdp:
      url_pattern: "yiyan.baidu.com"
    interaction:
      input:
        locators: [cdp]
        cdp:
          selector: "textarea#chat-input"
        send_on: Enter
      stop:
        cancel_button:
