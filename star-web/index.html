<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>群星 Star — AI Agent 调度中心</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<body>
  <div class="app-layout">

    <aside class="sidebar">

      <nav class="nav-items">
        <div class="nav-item active" data-page="starmap" data-tooltip="星图面板">

      </div>
    </aside>

    <!-- Main -->
    <main class="main-area">
      <!-- Header -->
      <header class="app-header">
        <div class="header-left">
          <h1 id="page-title">星图面板 / Star Map</h1>
          <span class="breadcrumb" id="page-breadcrumb">群星 Star > 星图</span>
        </div>
        <div class="header-right">
          <div class="ws-indicator">
            <span class="ws-dot" id="ws-dot"></span>
            <span class="ws-text" id="ws-text">连接中...</span>
          </div>
        </div>
      </header>

      <!-- Content -->
      <div class="main-content" id="main-content">
        <div class="loading-spinner"></div>
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="/static/js/api.js"></script>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/pages/starmap.js"></script>
  <script src="/static/js/pages/orbit.js"></script>
  <script src="/static/js/pages/starlight.js"></script>
