<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星际编程工作台 — 群星 Star</title>
    <style id="theme-vars">
:root {
  --color-bg-deep: #0a0e27;
  --color-bg-panel: #1a1f3a;
  --color-bg-card: #151934;
  --color-bg-elevated: #212647;
  --color-bg-hover: #2a3058;
  --color-primary: #ffd700;
  --color-primary-dim: rgba(255, 215, 0, 0.15);
  --color-primary-glow: rgba(255, 215, 0, 0.25);
  --color-success: #10b981;
  --color-warning: #f59e0b;
  --color-danger: #ef4444;
  --color-text-primary: #e8eaf6;
  --color-text-secondary: #9fa8da;
  --color-text-muted: #616885;
  --color-border: rgba(255, 255, 255, 0.08);
  --font-display: 'Inter', 'Noto Sans SC', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Consolas', monospace;
  --radius-md: 8px;
  --radius-lg: 12px;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="/ui/js/programming-store.js"></script>
    <script src="/ui/js/context-reader.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--color-bg-deep);
        color: var(--color-text-primary);
        font-family: var(--font-display);
        height: 100vh;
        overflow: hidden;
      }
      .layout { display: flex; height: 100vh; flex-direction: column; }
      .header {
        height: 56px;
        background: var(--color-bg-panel);
        border-bottom: 1px solid var(--color-border);
        display: flex;
        align-items: center;
        padding: 0 16px;
        gap: 12px;
        flex-shrink: 0;
      }
      .header-title { font-size: 16px; font-weight: 600; }
      .content { flex: 1; display: flex; overflow: hidden; }
      .sidebar {
        width: 260px;
        background: var(--color-bg-panel);
        border-right: 1px solid var(--color-border);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }
      .sidebar-header {
        padding: 12px;
        border-bottom: 1px solid var(--color-border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .sidebar-title { font-size: 13px; font-weight: 600; color: var(--color-text-secondary); }
      .task-list { flex: 1; overflow-y: auto; padding: 8px; }
      .task-card {
        background: var(--color-bg-card);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: 10px 12px;
        margin-bottom: 8px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .task-card:hover { border-color: var(--color-border-glow); }
      .task-card.active { border-color: var(--color-primary); background: var(--color-primary-dim); }
      .task-card.todo { border-left: 3px solid var(--color-text-muted); }
      .task-card.in_progress { border-left: 3px solid var(--color-warning); }
      .task-card.done { border-left: 3px solid var(--color-success); }
      .task-title { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
      .task-meta { font-size: 11px; color: var(--color-text-muted); display: flex; align-items: center; gap: 8px; }
      .task-ais { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
      .task-ai-chip { font-size: 10px; padding: 2px 6px; background: var(--color-bg-elevated); border-radius: 4px; color: var(--color-text-secondary); }
      .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
      .main-empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--color-text-muted);
        text-align: center;
        padding: 40px;
      }
      .main-empty .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
      .main-empty .text { font-size: 14px; margin-bottom: 16px; }
      .workspace-header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--color-border);
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--color-bg-panel);
        flex-shrink: 0;
      }
      .workspace-title { font-size: 15px; font-weight: 600; flex: 1; }
      .workspace { flex: 1; display: flex; gap: 12px; padding: 12px; overflow: hidden; }
      .ai-panel {
        flex: 1;
        background: var(--color-bg-card);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-width: 300px;
      }
      .ai-panel-header {
        padding: 10px 12px;
        border-bottom: 1px solid var(--color-border);
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--color-bg-elevated);
        flex-shrink: 0;
      }
      .ai-panel-status { width: 8px; height: 8px; border-radius: 50%; }
      .ai-panel-status.idle { background: var(--color-text-muted); }
      .ai-panel-status.working { background: var(--color-warning); animation: pulse 1s infinite; }
      .ai-panel-status.ready { background: var(--color-success); }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      .ai-panel-title { font-size: 13px; font-weight: 500; flex: 1; }
      .ai-panel-body { flex: 1; overflow-y: auto; padding: 12px; }
      .ai-message {
        margin-bottom: 12px;
        padding: 10px 12px;
        border-radius: var(--radius-md);
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      .ai-message.user { background: var(--color-primary-dim); border: 1px solid var(--color-primary-glow); }
      .ai-message.assistant { background: var(--color-bg-elevated); font-family: var(--font-mono); font-size: 12px; }
      .ai-panel-input { padding: 12px; border-top: 1px solid var(--color-border); display: flex; gap: 8px; flex-shrink: 0; }
      .ai-input {
        flex: 1;
        padding: 8px 12px;
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        color: var(--color-text-primary);
        font-size: 13px;
        resize: none;
        min-height: 40px;
        max-height: 100px;
        font-family: var(--font-display);
      }
      .ai-input:focus { outline: none; border-color: var(--color-primary); }
      .footer {
        height: 48px;
        background: var(--color-bg-panel);
        border-top: 1px solid var(--color-border);
        display: flex;
        align-items: center;
        padding: 0 16px;
        gap: 8px;
        flex-shrink: 0;
      }
      .ai-status-item {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        background: var(--color-bg-elevated);
        border-radius: 20px;
        font-size: 12px;
        cursor: pointer;
        border: 1px solid transparent;
        transition: all 0.2s;
      }
      .ai-status-item:hover { background: var(--color-bg-hover); border-color: var(--color-border-glow); }
      .ai-status-item.assigned { background: var(--color-primary-dim); border-color: var(--color-primary); }
      .ai-status-dot { width: 6px; height: 6px; border-radius: 50%; }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        background: var(--color-bg-elevated);
        color: var(--color-text-primary);
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn:hover { background: var(--color-bg-hover); }
      .btn-primary { background: var(--color-primary); color: #1a1f3a; border-color: var(--color-primary); font-weight: 500; }
      .btn-sm { padding: 5px 10px; font-size: 12px; }
      .btn-danger { color: var(--color-danger); border-color: var(--color-danger); }
      .send-btn {
        padding: 8px 16px;
        background: var(--color-primary);
        border: none;
        border-radius: var(--radius-md);
        color: #1a1f3a;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
      }
      .send-btn:hover { opacity: 0.9; }
      .modal-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .modal { background: var(--color-bg-panel); border-radius: var(--radius-lg); padding: 24px; width: 400px; max-width: 90%; }
      .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
      .modal-body input, .modal-body textarea {
        width: 100%;
        padding: 8px 12px;
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        color: var(--color-text-primary);
        font-size: 13px;
        margin-bottom: 12px;
        font-family: var(--font-display);
      }
      .modal-body textarea { resize: vertical; min-height: 80px; }
      .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

      /* Compare View */
      .compare-view {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .compare-toolbar {
        padding: 10px 16px;
        background: var(--color-bg-elevated);
        border-bottom: 1px solid var(--color-border);
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }
      .compare-toolbar-title {
        font-size: 13px;
        font-weight: 500;
        flex: 1;
      }
      .compare-toolbar label {
        font-size: 12px;
        color: var(--color-text-secondary);
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
      }
      .compare-panels {
        flex: 1;
        display: flex;
        overflow: hidden;
      }
      .compare-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--color-border);
        overflow: hidden;
      }
      .compare-panel:last-child { border-right: none; }
      .compare-panel-header {
        padding: 8px 12px;
        background: var(--color-bg-card);
        border-bottom: 1px solid var(--color-border);
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .compare-panel-title { font-size: 12px; font-weight: 500; flex: 1; }
      .compare-panel-body {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .diff-add { background: rgba(16, 185, 129, 0.15); color: #34d399; border-left: 2px solid #10b981; padding-left: 6px; }
      .diff-remove { background: rgba(239, 68, 68, 0.15); color: #f87171; border-left: 2px solid #ef4444; padding-left: 6px; text-decoration: line-through; opacity: 0.7; }
      .diff-same { color: var(--color-text-primary); }
      .compare-selectors {
        display: flex;
        gap: 8px;
        padding: 8px 16px;
        background: var(--color-bg-card);
        border-bottom: 1px solid var(--color-border);
        flex-shrink: 0;
      }
      .compare-select {
        padding: 6px 10px;
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        color: var(--color-text-primary);
        font-size: 12px;
      }
      .compare-stats {
        display: flex;
        gap: 16px;
        font-size: 11px;
        color: var(--color-text-muted);
      }
      .compare-stats .add-count { color: #34d399; }
      .compare-stats .remove-count { color: #f87171; }
    </style>
</head>
<body>
    <div class="layout">
        <div class="header">
            <span class="header-title">🚀 星际编程工作台</span>
            <div style="margin-left: auto; display: flex; gap: 8px;">
                <button class="btn btn-sm" onclick="showContextModal()">📋 上下文卡</button>
            </div>
        </div>
        <div class="content">
            <div class="sidebar">
                <div class="sidebar-header">
                    <span class="sidebar-title">任务列表</span>
                    <button class="btn btn-sm btn-primary" onclick="showNewTaskModal()">+ 新建</button>
                </div>
                <div class="task-list" id="taskList"></div>
            </div>
            <div class="main" id="mainArea">
                <div class="main-empty">
                    <div class="icon">🚀</div>
                    <div class="text">选择一个任务或创建新任务开始编程</div>
                    <button class="btn btn-primary" onclick="showNewTaskModal()">创建任务</button>
                </div>
            </div>
        </div>
        <div class="footer" id="footer"></div>
    </div>

    <div id="newTaskModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-title">新建任务</div>
            <div class="modal-body">
                <input type="text" id="taskTitleInput" placeholder="任务标题">
                <textarea id="taskDescInput" placeholder="任务描述（可选）"></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn" onclick="closeNewTaskModal()">取消</button>
                <button class="btn btn-primary" onclick="createTask()">创建</button>
            </div>
        </div>
    </div>

    <div id="contextModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-title">项目上下文</div>
            <div class="modal-body">
                <div id="contextPreview" style="padding: 12px; background: var(--color-bg-elevated); border-radius: var(--radius-md); margin-bottom: 12px; font-size: 12px; font-family: var(--font-mono); white-space: pre-wrap; min-height: 60px;"></div>
                <button class="btn btn-sm" onclick="copyContext()">📋 复制上下文</button>
            </div>
            <div class="modal-actions">
                <button class="btn" onclick="closeContextModal()">关闭</button>
            </div>
        </div>
    </div>

    <script>
        let currentContext = null;
        let compareMode = false;
        let syncScroll = false;
        let compareLeftAI = null;
        let compareRightAI = null;

        async function init() {
            currentContext = await contextReader.readCurrentContext();
            renderTaskList();
            renderAIStatus();
            programmingStore.subscribe(() => {
                renderTaskList();
            });
        }

        function renderTaskList() {
            const container = document.getElementById('taskList');
            const tasks = programmingStore.getAllTasks();
            
            if (tasks.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--color-text-muted); font-size: 13px;">暂无任务<br><span style="font-size:11px;">点击上方"新建"创建任务</span></div>';
                return;
            }
            
            const statusGroups = { todo: [], in_progress: [], done: [] };
            tasks.forEach(t => statusGroups[t.status].push(t));
            
            let html = '';
            if (statusGroups.todo.length > 0) {
                html += `<div style="font-size: 11px; color: var(--color-text-muted); margin-bottom: 8px;">待办 (${statusGroups.todo.length})</div>`;
                html += statusGroups.todo.map(t => renderTaskCard(t)).join('');
            }
            if (statusGroups.in_progress.length > 0) {
                html += `<div style="font-size: 11px; color: var(--color-text-muted); margin: 12px 0 8px;">进行中 (${statusGroups.in_progress.length})</div>`;
                html += statusGroups.in_progress.map(t => renderTaskCard(t)).join('');
            }
            if (statusGroups.done.length > 0) {
                html += `<div style="font-size: 11px; color: var(--color-text-muted); margin: 12px 0 8px;">已完成 (${statusGroups.done.length})</div>`;
                html += statusGroups.done.map(t => renderTaskCard(t)).join('');
            }
            
            container.innerHTML = html;
        }

        function renderTaskCard(task) {
            const isActive = programmingStore.getCurrentTask()?.id === task.id;
            const statusText = { todo: '待办', in_progress: '进行中', done: '已完成' }[task.status] || task.status;
            const ais = task.assignedAIs.map(ai => `<span class="task-ai-chip">${ai}</span>`).join('');
            
            return `
                <div class="task-card ${task.status} ${isActive ? 'active' : ''}" onclick="selectTask('${task.id}')">
                    <div class="task-title">${escapeHtml(task.title)}</div>
                    <div class="task-meta">
                        <span>${statusText}</span>
                        ${task.assignedAIs.length > 0 ? `<span>· ${task.assignedAIs.length} 个 AI</span>` : ''}
                    </div>
                    ${ais ? `<div class="task-ais">${ais}</div>` : ''}
                </div>
            `;
        }

        function selectTask(taskId) {
            programmingStore.setCurrentTask(taskId);
            renderWorkspace(taskId);
        }

        function renderWorkspace(taskId) {
            const task = programmingStore.getTask(taskId);
            if (!task) return;
            
            const container = document.getElementById('mainArea');
            
            const statusSelect = `
                <select class="btn btn-sm" onchange="changeTaskStatus('${task.id}', this.value)">
                    <option value="todo" ${task.status === 'todo' ? 'selected' : ''}>待办</option>
                    <option value="in_progress" ${task.status === 'in_progress' ? 'selected' : ''}>进行中</option>
                    <option value="done" ${task.status === 'done' ? 'selected' : ''}>已完成</option>
                </select>
            `;
            
            if (task.assignedAIs.length === 0) {
                container.innerHTML = `
                    <div class="workspace-header">
                        <div class="workspace-title">${escapeHtml(task.title)}</div>
                        ${statusSelect}
                        <button class="btn btn-sm btn-danger" onclick="deleteTask('${task.id}')">删除</button>
                    </div>
                    <div class="main-empty">
                        <div class="icon">🤖</div>
                        <div class="text">从下方添加 AI 开始对话</div>
                        <div style="font-size: 12px; color: var(--color-text-muted);">点击底部的 AI 状态分配到任务</div>
                    </div>
                `;
                return;
            }
            
            const panels = task.assignedAIs.map(aiId => renderAIPanel(task.id, aiId)).join('');
            
            const compareBtn = task.assignedAIs.length >= 2 
                ? `<button class="btn btn-sm ${compareMode ? 'btn-primary' : ''}" onclick="toggleCompareMode()">${compareMode ? '退出对比' : '🔍 对比模式'}</button>`
                : '';
            
            if (compareMode && task.assignedAIs.length >= 2) {
                container.innerHTML = renderCompareView(task);
            } else {
                container.innerHTML = `
                    <div class="workspace-header">
                        <div class="workspace-title">${escapeHtml(task.title)}</div>
                        ${compareBtn}
                        ${statusSelect}
                        <button class="btn btn-sm btn-danger" onclick="deleteTask('${task.id}')">删除</button>
                    </div>
                    <div class="workspace">
                        ${panels}
                    </div>
                `;
            }
        }

        function renderAIPanel(taskId, aiId) {
            const dialogs = programmingStore.getDialogs(taskId);
            const aiDialog = dialogs.find(d => d.aiId === aiId);
            const messages = aiDialog?.messages || [];
            
            const messagesHtml = messages.length > 0 
                ? messages.map(msg => `<div class="ai-message ${msg.role}">${escapeHtml(msg.content)}</div>`).join('')
                : '<div style="color: var(--color-text-muted); text-align: center; padding: 20px; font-size: 13px;">开始对话...</div>';
            
            return `
                <div class="ai-panel">
                    <div class="ai-panel-header">
                        <span class="ai-panel-status idle"></span>
                        <span class="ai-panel-title">${aiId}</span>
                        <button class="btn btn-sm" onclick="unassignAI('${taskId}', '${aiId}')" style="padding: 3px 8px;">移除</button>
                    </div>
                    <div class="ai-panel-body">${messagesHtml}</div>
                    <div class="ai-panel-input">
                        <textarea class="ai-input" id="input-${aiId.replace(/\s+/g, '-')}" placeholder="输入指令..." rows="1" onkeydown="handleInputKey(event, '${taskId}', '${aiId}')"></textarea>
                        <button class="send-btn" onclick="sendToAI('${taskId}', '${aiId}')">发送</button>
                    </div>
                </div>
            `;
        }

        function renderAIStatus() {
            const container = document.getElementById('footer');
            const currentTask = programmingStore.getCurrentTask();
            const assignedAIs = currentTask?.assignedAIs || [];
            const availableAIs = ['Trae', 'Dumate', 'CodeArts', 'Claude', 'GPT-4'];
            
            const html = availableAIs.map(ai => {
                const isAssigned = assignedAIs.includes(ai);
                return `
                    <div class="ai-status-item ${isAssigned ? 'assigned' : ''}" onclick="${isAssigned ? '' : `assignAI('${ai}')`}">
                        <span class="ai-status-dot" style="background: ${isAssigned ? 'var(--color-success)' : 'var(--color-text-muted)'}"></span>
                        <span>${ai}</span>
                    </div>
                `;
            }).join('');
            
            container.innerHTML = html;
        }

        function assignAI(aiId) {
            const task = programmingStore.getCurrentTask();
            if (task) {
                programmingStore.assignAI(task.id, aiId);
                renderWorkspace(task.id);
                renderAIStatus();
            }
        }

        function unassignAI(taskId, aiId) {
            programmingStore.unassignAI(taskId, aiId);
            renderWorkspace(taskId);
            renderAIStatus();
        }

        function sendToAI(taskId, aiId) {
            const inputId = 'input-' + aiId.replace(/\s+/g, '-');
            const input = document.getElementById(inputId);
            const text = input?.value.trim();
            if (!text) return;
            
            programmingStore.addMessage(taskId, aiId, 'user', text);
            input.value = '';
            renderWorkspace(taskId);
            
            // TODO: 调用真实 API
            // 模拟回复
            setTimeout(() => {
                programmingStore.addMessage(taskId, aiId, 'assistant', '这是 AI 的模拟回复。\n\n实际使用时将调用真实的 AI Agent API。');
                renderWorkspace(taskId);
            }, 1000);
        }

        function handleInputKey(event, taskId, aiId) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendToAI(taskId, aiId);
            }
        }

        function changeTaskStatus(taskId, status) {
            programmingStore.updateTask(taskId, { status });
            renderTaskList();
        }

        function deleteTask(taskId) {
            if (confirm('确定要删除这个任务吗？')) {
                programmingStore.deleteTask(taskId);
                document.getElementById('mainArea').innerHTML = `
                    <div class="main-empty">
                        <div class="icon">🚀</div>
                        <div class="text">选择一个任务或创建新任务开始编程</div>
                        <button class="btn btn-primary" onclick="showNewTaskModal()">创建任务</button>
                    </div>
                `;
            }
        }

        function showNewTaskModal() {
            document.getElementById('newTaskModal').style.display = 'flex';
            document.getElementById('taskTitleInput').focus();
        }

        function closeNewTaskModal() {
            document.getElementById('newTaskModal').style.display = 'none';
            document.getElementById('taskTitleInput').value = '';
            document.getElementById('taskDescInput').value = '';
        }

        function createTask() {
            const title = document.getElementById('taskTitleInput').value.trim();
            const desc = document.getElementById('taskDescInput').value.trim();
            if (!title) { alert('请输入任务标题'); return; }
            
            const task = programmingStore.createTask(title, desc);
            closeNewTaskModal();
            selectTask(task.id);
        }

        async function showContextModal() {
            const preview = document.getElementById('contextPreview');
            preview.textContent = currentContext ? contextReader.generateContextText(currentContext) : '无法读取上下文';
            document.getElementById('contextModal').style.display = 'flex';
        }

        function closeContextModal() {
            document.getElementById('contextModal').style.display = 'none';
        }

        async function copyContext() {
            const text = currentContext ? contextReader.generateContextText(currentContext) : '';
            const success = await contextReader.copyToClipboard(text);
            alert(success ? '上下文已复制到剪贴板' : '复制失败');
        }

        // ========== 对比模式 ==========

        function toggleCompareMode() {
            const task = programmingStore.getCurrentTask();
            if (!task || task.assignedAIs.length < 2) return;
            
            compareMode = !compareMode;
            
            if (compareMode) {
                if (!compareLeftAI) compareLeftAI = task.assignedAIs[0];
                if (!compareRightAI) compareRightAI = task.assignedAIs[1] || task.assignedAIs[0];
            }
            
            renderWorkspace(task.id);
        }

        function renderCompareView(task) {
            const leftText = getLastAssistantMessage(task.id, compareLeftAI);
            const rightText = getLastAssistantMessage(task.id, compareRightAI);
            
            let diffStats = { add: 0, remove: 0 };
            let leftDiffHtml = '';
            let rightDiffHtml = '';
            
            if (leftText && rightText) {
                const diff = computeLineDiff(leftText, rightText);
                diffStats = diff.stats;
                leftDiffHtml = diff.leftHtml;
                rightDiffHtml = diff.rightHtml;
            } else {
                leftDiffHtml = leftText ? escapeHtml(leftText) : '<span style="color: var(--color-text-muted);">暂无回复</span>';
                rightDiffHtml = rightText ? escapeHtml(rightText) : '<span style="color: var(--color-text-muted);">暂无回复</span>';
            }
            
            return `
                <div class="workspace-header">
                    <div class="workspace-title">${escapeHtml(task.title)} — 结果对比</div>
                    <button class="btn btn-sm btn-primary" onclick="toggleCompareMode()">退出对比</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteTask('${task.id}')">删除</button>
                </div>
                <div class="compare-view">
                    <div class="compare-selectors">
                        <select class="compare-select" onchange="setCompareLeft(this.value)">
                            <option value="" disabled>选择左侧 AI</option>
                            ${task.assignedAIs.map(ai => `<option value="${ai}" ${ai === compareLeftAI ? 'selected' : ''}>${ai}</option>`).join('')}
                        </select>
                        <span style="color: var(--color-text-muted); align-self: center;">VS</span>
                        <select class="compare-select" onchange="setCompareRight(this.value)">
                            <option value="" disabled>选择右侧 AI</option>
                            ${task.assignedAIs.map(ai => `<option value="${ai}" ${ai === compareRightAI ? 'selected' : ''}>${ai}</option>`).join('')}
                        </select>
                        <div class="compare-stats">
                            <span class="add-count">+ ${diffStats.add} 新增</span>
                            <span class="remove-count">- ${diffStats.remove} 差异</span>
                        </div>
                    </div>
                    <div class="compare-toolbar">
                        <span class="compare-toolbar-title">
                            ${leftText ? `${leftText.length} 字符` : '暂无回复'} 
                            ↔ 
                            ${rightText ? `${rightText.length} 字符` : '暂无回复'}
                        </span>
                        <label>
                            <input type="checkbox" ${syncScroll ? 'checked' : ''} onchange="toggleSyncScroll(this.checked)">
                            同步滚动
                        </label>
                        <button class="btn btn-sm" onclick="copyCompareLeft()">📋 复制左侧</button>
                        <button class="btn btn-sm" onclick="copyCompareRight()">📋 复制右侧</button>
                    </div>
                    <div class="compare-panels">
                        <div class="compare-panel">
                            <div class="compare-panel-header">
                                <span class="compare-panel-title">${compareLeftAI || '未选择'}</span>
                            </div>
                            <div class="compare-panel-body" id="compareLeftBody" onscroll="handleCompareScroll('left')">
                                ${leftDiffHtml}
                            </div>
                        </div>
                        <div class="compare-panel">
                            <div class="compare-panel-header">
                                <span class="compare-panel-title">${compareRightAI || '未选择'}</span>
                            </div>
                            <div class="compare-panel-body" id="compareRightBody" onscroll="handleCompareScroll('right')">
                                ${rightDiffHtml}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function setCompareLeft(aiId) {
            compareLeftAI = aiId;
            const task = programmingStore.getCurrentTask();
            if (task) renderWorkspace(task.id);
        }

        function setCompareRight(aiId) {
            compareRightAI = aiId;
            const task = programmingStore.getCurrentTask();
            if (task) renderWorkspace(task.id);
        }

        function toggleSyncScroll(enabled) {
            syncScroll = enabled;
        }

        let isSyncing = false;
        function handleCompareScroll(side) {
            if (!syncScroll || isSyncing) return;
            isSyncing = true;
            
            const leftBody = document.getElementById('compareLeftBody');
            const rightBody = document.getElementById('compareRightBody');
            
            if (leftBody && rightBody) {
                const source = side === 'left' ? leftBody : rightBody;
                const target = side === 'left' ? rightBody : leftBody;
                
                const scrollRatio = source.scrollTop / (source.scrollHeight - source.clientHeight);
                target.scrollTop = scrollRatio * (target.scrollHeight - target.clientHeight);
            }
            
            setTimeout(() => { isSyncing = false; }, 10);
        }

        function getLastAssistantMessage(taskId, aiId) {
            if (!aiId) return '';
            const dialog = programmingStore.getAIDialog(taskId, aiId);
            if (!dialog || !dialog.messages) return '';
            const assistantMsgs = dialog.messages.filter(m => m.role === 'assistant');
            return assistantMsgs.length > 0 ? assistantMsgs[assistantMsgs.length - 1].content : '';
        }

        function copyCompareLeft() {
            const task = programmingStore.getCurrentTask();
            if (!task) return;
            const text = getLastAssistantMessage(task.id, compareLeftAI);
            contextReader.copyToClipboard(text);
            alert('左侧内容已复制');
        }

        function copyCompareRight() {
            const task = programmingStore.getCurrentTask();
            if (!task) return;
            const text = getLastAssistantMessage(task.id, compareRightAI);
            contextReader.copyToClipboard(text);
            alert('右侧内容已复制');
        }

        // ========== 差异算法 ==========

        function computeLineDiff(text1, text2) {
            const lines1 = text1.split('\n');
            const lines2 = text2.split('\n');
            
            const result = lcsDiff(lines1, lines2);
            
            let leftHtml = '';
            let rightHtml = '';
            let addCount = 0;
            let removeCount = 0;
            
            result.forEach(op => {
                if (op.type === 'same') {
                    leftHtml += `<div class="diff-same">${escapeHtml(op.value)}</div>`;
                    rightHtml += `<div class="diff-same">${escapeHtml(op.value)}</div>`;
                } else if (op.type === 'remove') {
                    leftHtml += `<div class="diff-remove">${escapeHtml(op.value)}</div>`;
                    removeCount++;
                } else if (op.type === 'add') {
                    rightHtml += `<div class="diff-add">${escapeHtml(op.value)}</div>`;
                    addCount++;
                }
            });
            
            return {
                leftHtml,
                rightHtml,
                stats: { add: addCount, remove: removeCount }
            };
        }

        function lcsDiff(a, b) {
            const m = a.length;
            const n = b.length;
            
            const dp = [];
            for (let i = 0; i <= m; i++) {
                dp[i] = [];
                for (let j = 0; j <= n; j++) {
                    dp[i][j] = 0;
                }
            }
            
            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    if (a[i-1] === b[j-1]) {
                        dp[i][j] = dp[i-1][j-1] + 1;
                    } else {
                        dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
                    }
                }
            }
            
            const result = [];
            let i = m, j = n;
            
            while (i > 0 || j > 0) {
                if (i > 0 && j > 0 && a[i-1] === b[j-1]) {
                    result.unshift({ type: 'same', value: a[i-1] });
                    i--;
                    j--;
                } else if (j > 0 && (i === 0 || dp[i][j-1] >= dp[i-1][j])) {
                    result.unshift({ type: 'add', value: b[j-1] });
                    j--;
                } else {
                    result.unshift({ type: 'remove', value: a[i-1] });
                    i--;
                }
            }
            
            return result;
        }

        function escapeHtml(text) {
            if (!text && text !== '') return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        init();
    </script>
</body>
</html>
