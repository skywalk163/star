<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>调度中心 - 群星 Star</title>
  <style>
    :root {
      --color-bg: #0a0a0f;
      --color-bg-panel: #12121a;
      --color-bg-card: #1a1a24;
      --color-bg-hover: #222230;
      --color-border: rgba(255, 215, 0, 0.12);
      --color-border-glow: rgba(255, 215, 0, 0.3);
      --color-primary: #ffd700;
      --color-primary-muted: rgba(255, 215, 0, 0.5);
      --color-text: #e0e0e8;
      --color-text-secondary: #8888a0;
      --color-text-muted: #555568;
      --color-text-gold: #ffd700;
      --color-success: #22c55e;
      --color-warning: #f59e0b;
      --color-error: #ef4444;
      --font-display: 'Cinzel', 'Songti SC', serif;
      --font-body: 'Inter', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
      min-height: 100vh;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 240px;
      background: var(--color-bg-panel);
      border-right: 1px solid var(--color-border);
      padding: 24px 16px;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-logo {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--color-primary);
      text-align: center;
      margin-bottom: 32px;
      letter-spacing: 2px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 8px;
      color: var(--color-text-secondary);
      text-decoration: none;
      font-size: 14px;
      transition: all 0.2s;
      margin-bottom: 4px;
    }

    .nav-item:hover {
      background: var(--color-bg-hover);
      color: var(--color-text);
    }

    .nav-item.active {
      background: rgba(255, 215, 0, 0.08);
      color: var(--color-primary);
    }

    .nav-item svg { width: 18px; height: 18px; }

    .main {
      flex: 1;
      margin-left: 240px;
      padding: 32px;
    }

    .page-header {
      margin-bottom: 32px;
    }

    .page-title {
      font-family: var(--font-display);
      font-size: 28px;
      color: var(--color-primary);
      margin-bottom: 8px;
    }

    .page-subtitle {
      color: var(--color-text-secondary);
      font-size: 14px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .panel {
      background: var(--color-bg-panel);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-bg-card);
    }

    .panel-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--color-text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-title svg { width: 18px; height: 18px; color: var(--color-primary); }

    .panel-body {
      padding: 16px 20px;
    }

    /* AI 卡片 */
    .ai-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 400px;
      overflow-y: auto;
    }

    .ai-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ai-card:hover {
      border-color: var(--color-primary-muted);
      background: rgba(255, 215, 0, 0.03);
    }

    .ai-card.selected {
      border-color: var(--color-primary);
      background: rgba(255, 215, 0, 0.08);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
    }

    .ai-avatar {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--color-primary), #ff8c00);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .ai-info { flex: 1; min-width: 0; }

    .ai-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: 4px;
    }

    .ai-meta {
      font-size: 12px;
      color: var(--color-text-muted);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ai-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .ai-status.running { background: rgba(34, 197, 94, 0.15); color: var(--color-success); }
    .ai-status.idle { background: rgba(255, 215, 0, 0.15); color: var(--color-primary); }
    .ai-status.busy { background: rgba(245, 158, 11, 0.15); color: var(--color-warning); }

    .ai-status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    /* 任务列表 */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 400px;
      overflow-y: auto;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .task-item:hover {
      border-color: var(--color-primary-muted);
    }

    .task-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(255, 215, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-primary);
    }

    .task-icon svg { width: 18px; height: 18px; }

    .task-info { flex: 1; min-width: 0; }

    .task-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-meta {
      font-size: 11px;
      color: var(--color-text-muted);
      margin-top: 2px;
    }

    .task-time {
      font-size: 11px;
      color: var(--color-text-muted);
      flex-shrink: 0;
    }

    /* 指令发送面板 */
    .dispatch-panel {
      grid-column: 1 / -1;
    }

    .dispatch-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-row {
      display: flex;
      gap: 16px;
    }

    .form-group {
      flex: 1;
    }

    .form-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--color-text-secondary);
      margin-bottom: 6px;
      display: block;
    }

    .form-select, .form-input {
      width: 100%;
      padding: 12px 16px;
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      color: var(--color-text);
      font-size: 14px;
      transition: all 0.2s;
    }

    .form-select:focus, .form-input:focus {
      outline: none;
      border-color: var(--color-primary);
    }

    .form-textarea {
      width: 100%;
      min-height: 120px;
      padding: 12px 16px;
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      color: var(--color-text);
      font-size: 14px;
      resize: vertical;
      transition: all 0.2s;
    }

    .form-textarea:focus {
      outline: none;
      border-color: var(--color-primary);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--color-primary), #ff8c00);
      color: #0a0a0f;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(255, 215, 0, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-secondary {
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      color: var(--color-text-secondary);
    }

    .btn-secondary:hover {
      border-color: var(--color-primary-muted);
      color: var(--color-text);
    }

    .btn svg { width: 18px; height: 18px; }

    /* 响应展示 */
    .response-area {
      margin-top: 16px;
      padding: 16px;
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      min-height: 80px;
    }

    .response-label {
      font-size: 11px;
      color: var(--color-text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .response-content {
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      color: var(--color-text);
    }

    .response-source {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      margin-left: 8px;
    }

    .response-source.log { background: rgba(34, 197, 94, 0.15); color: var(--color-success); }
    .response-source.ocr { background: rgba(255, 215, 0, 0.15); color: var(--color-primary); }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--color-text-muted);
    }

    .empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.3; }
    .empty-state p { font-size: 13px; }

    /* 骨架屏 */
    .skeleton {
      background: linear-gradient(90deg, var(--color-bg-card) 25%, var(--color-bg-hover) 50%, var(--color-bg-card) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 4px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-card {
      height: 80px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    /* 加载动画 */
    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--color-border);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 右下角帮助按钮 */
    #onboarding-help-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--color-primary), #ffb700);
      color: #0a0a0f;
      border: none;
      cursor: pointer;
      font-size: 20px;
      font-weight: 700;
      box-shadow: 0 4px 20px rgba(255, 215, 0, 0.4);
      z-index: 9998;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
    }
  </style>
</head>
<body>
  <div class="layout">
    <!-- 侧边栏 -->
    <nav class="sidebar">
      <div class="sidebar-logo">群星 Star</div>
      <a href="/ui/pages/starmap.html" class="nav-item" data-dom-id="nav-starmap">
        <i data-lucide="map"></i> 星图
      </a>
      <a href="/ui/pages/starlight.html" class="nav-item" data-dom-id="nav-starlight">
        <i data-lucide="sparkles"></i> 星辉
      </a>
      <a href="/ui/pages/dispatch.html" class="nav-item active" data-dom-id="nav-dispatch">
        <i data-lucide="radar"></i> 调度中心
      </a>
      <a href="/ui/pages/dumate.html" class="nav-item" data-dom-id="nav-dumate">
        <i data-lucide="zap"></i> 搭子桥
      </a>
      <a href="/ui/pages/settings.html" class="nav-item" data-dom-id="nav-settings">
        <i data-lucide="settings"></i> 设置
      </a>
    </nav>

    <!-- 主内容 -->
    <main class="main">
      <header class="page-header">
        <h1 class="page-title">调度中心</h1>
        <p class="page-subtitle">选择 AI Agent，发送指令，查看响应</p>
      </header>

      <div class="grid-2">
        <!-- AI 选择面板 -->
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">
              <i data-lucide="cpu"></i>
              可用 AI Agent
            </div>
            <button class="btn btn-secondary" onclick="refreshAIs()" style="padding: 6px 12px; font-size: 12px;">
              <i data-lucide="refresh-cw"></i> 刷新
            </button>
          </div>
          <div class="panel-body">
            <div class="ai-list" id="aiList">
              <div class="skeleton skeleton-card"></div>
              <div class="skeleton skeleton-card"></div>
            </div>
          </div>
        </div>

        <!-- 任务历史面板 -->
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">
              <i data-lucide="folder-history"></i>
              历史任务
            </div>
          </div>
          <div class="panel-body">
            <div class="task-list" id="taskList">
              <div class="skeleton skeleton-card" style="height: 60px;"></div>
              <div class="skeleton skeleton-card" style="height: 60px;"></div>
            </div>
          </div>
        </div>

        <!-- 指令发送面板 -->
        <div class="panel dispatch-panel">
          <div class="panel-header">
            <div class="panel-title">
              <i data-lucide="send"></i>
              发送指令
            </div>
          </div>
          <div class="panel-body">
            <div class="dispatch-form">
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">选择 AI</label>
                  <select class="form-select" id="selectedAI" onchange="onAISelect()">
                    <option value="">-- 请选择 AI --</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">选择任务（可选）</label>
                  <select class="form-select" id="selectedTask">
                    <option value="">-- 不指定任务 --</option>
                  </select>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">指令内容</label>
                <textarea class="form-textarea" id="promptInput" placeholder="输入要发送的指令..."></textarea>
              </div>
              <div class="form-row">
                <button class="btn btn-secondary" onclick="clearPrompt()">
                  <i data-lucide="trash-2"></i> 清空
                </button>
                <button class="btn btn-primary" id="sendBtn" onclick="sendPrompt()" disabled>
                  <i data-lucide="send"></i> 发送指令
                </button>
              </div>
              <div class="response-area" id="responseArea" style="display: none;">
                <div class="response-label">
                  响应 <span id="responseSource"></span>
                  <span id="responseTime"></span>
                </div>
                <div class="response-content" id="responseContent"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <script src="/ui/js/api-bridge.js"></script>
  <script src="/ui/js/nav.js"></script>
  <script src="/ui/js/onboarding.js"></script>
  <script>
    lucide.createIcons();

    // 全局状态
    let aiList = [];
    let taskList = [];
    let selectedAI = null;

    // 初始化
    async function init() {
      await Promise.all([refreshAIs(), loadTasks()]);
      updateSendButton();
    }

    // 刷新 AI 列表
    async function refreshAIs() {
      const container = document.getElementById('aiList');
      container.innerHTML = '<div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div>';

      try {
        const data = await workApi.listAIs();
        aiList = data.ais || [];

        if (aiList.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <i data-lucide="cpu"></i>
              <p>暂未发现运行的 AI Agent</p>
              <p style="margin-top: 8px; font-size: 11px;">请先启动 Trae 或其他 AI 软件</p>
            </div>
          `;
          lucide.createIcons();
          return;
        }

        container.innerHTML = aiList.map(ai => `
          <div class="ai-card" onclick="selectAI('${ai.ai_id}')" data-id="${ai.ai_id}">
            <div class="ai-avatar">${getAIIcon(ai.type)}</div>
            <div class="ai-info">
              <div class="ai-name">${ai.name}</div>
              <div class="ai-meta">
                <span class="ai-status ${ai.status}">
                  <span class="ai-status-dot"></span>
                  ${ai.status === 'running' ? '运行中' : ai.status === 'busy' ? '忙碌中' : '空闲'}
                </span>
                ${ai.uptime ? '<span>' + ai.uptime + '</span>' : ''}
              </div>
            </div>
          </div>
        `).join('');

        // 更新下拉框
        updateAISelect();

      } catch (err) {
        container.innerHTML = `
          <div class="empty-state">
            <i data-lucide="alert-circle"></i>
            <p>加载失败: ${err.message}</p>
          </div>
        `;
        lucide.createIcons();
      }
    }

    // 获取 AI 图标
    function getAIIcon(type) {
      const icons = {
        'trae': 'T',
        'cursor': 'C',
        'claude': 'A',
        'default': 'AI'
      };
      return icons[type] || icons.default;
    }

    // 选择 AI
    function selectAI(aiId) {
      selectedAI = aiList.find(ai => ai.ai_id === aiId);

      // 更新 UI
      document.querySelectorAll('.ai-card').forEach(card => {
        card.classList.toggle('selected', card.dataset.id === aiId);
      });

      document.getElementById('selectedAI').value = aiId;
      updateSendButton();

      if (selectedAI) {
        showNotification(`已选择: ${selectedAI.name}`, 'success', 1500);
      }
    }

    // AI 选择变化
    function onAISelect() {
      const aiId = document.getElementById('selectedAI').value;
      if (aiId) {
        selectAI(aiId);
      } else {
        selectedAI = null;
        document.querySelectorAll('.ai-card').forEach(card => card.classList.remove('selected'));
      }
      updateSendButton();
    }

    // 更新 AI 下拉框
    function updateAISelect() {
      const select = document.getElementById('selectedAI');
      select.innerHTML = '<option value="">-- 请选择 AI --</option>' +
        aiList.map(ai => `<option value="${ai.ai_id}">${ai.name} (${ai.type})</option>`).join('');
    }

    // 加载任务列表
    async function loadTasks() {
      const container = document.getElementById('taskList');
      container.innerHTML = '<div class="skeleton skeleton-card" style="height: 60px;"></div><div class="skeleton skeleton-card" style="height: 60px;"></div>';

      try {
        taskList = await workApi.listTasks();

        if (taskList.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <i data-lucide="folder"></i>
              <p>暂无历史任务</p>
            </div>
          `;
          lucide.createIcons();
          return;
        }

        container.innerHTML = taskList.map(task => `
          <div class="task-item" onclick="selectTask('${task.task_id}')" data-id="${task.task_id}">
            <div class="task-icon">
              <i data-lucide="file-code"></i>
            </div>
            <div class="task-info">
              <div class="task-name">${task.name}</div>
              <div class="task-meta">
                ${task.script_files.length} 脚本 · ${task.output_files.length} 输出
              </div>
            </div>
            <div class="task-time">${formatTime(task.updated_at)}</div>
          </div>
        `).join('');

        // 更新任务下拉框
        updateTaskSelect();

      } catch (err) {
        container.innerHTML = `
          <div class="empty-state">
            <i data-lucide="alert-circle"></i>
            <p>加载失败: ${err.message}</p>
          </div>
        `;
        lucide.createIcons();
      }
    }

    // 选择任务
    function selectTask(taskId) {
      const task = taskList.find(t => t.task_id === taskId);
      if (task) {
        document.getElementById('selectedTask').value = taskId;
        showNotification(`已选择任务: ${task.name}`, 'info', 1500);
      }
    }

    // 更新任务下拉框
    function updateTaskSelect() {
      const select = document.getElementById('selectedTask');
      select.innerHTML = '<option value="">-- 不指定任务 --</option>' +
        taskList.map(task => `<option value="${task.task_id}">${task.name}</option>`).join('');
    }

    // 格式化时间
    function formatTime(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      const now = new Date();
      const diff = now - d;

      if (diff < 60000) return '刚刚';
      if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
      if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
      if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
      return d.toLocaleDateString('zh-CN');
    }

    // 更新发送按钮状态
    function updateSendButton() {
      const btn = document.getElementById('sendBtn');
      const prompt = document.getElementById('promptInput').value.trim();
      btn.disabled = !selectedAI || !prompt;
    }

    // 清空指令
    function clearPrompt() {
      document.getElementById('promptInput').value = '';
      document.getElementById('responseArea').style.display = 'none';
      updateSendButton();
    }

    // 发送指令
    async function sendPrompt() {
      if (!selectedAI) {
        showNotification('请先选择 AI', 'warning');
        return;
      }

      const prompt = document.getElementById('promptInput').value.trim();
      if (!prompt) {
        showNotification('请输入指令内容', 'warning');
        return;
      }

      const btn = document.getElementById('sendBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="loading-spinner"></span> 发送中...';

      const responseArea = document.getElementById('responseArea');
      responseArea.style.display = 'block';
      document.getElementById('responseContent').innerHTML = '<span class="loading-spinner"></span> 等待响应...';
      document.getElementById('responseSource').textContent = '';

      const startTime = Date.now();

      try {
        const data = await workApi.askAI(selectedAI.ai_id, {
          prompt: prompt,
          adapter_name: 'trae',
          timeout: 60,
        });

        const elapsed = Date.now() - startTime;
        const response = data.last_turn?.response || data.response || '无响应';
        const source = data.last_turn?.response_source || 'unknown';

        document.getElementById('responseContent').textContent = response;
        document.getElementById('responseSource').innerHTML = `<span class="response-source ${source}">${source === 'log' ? '日志' : 'OCR'}</span>`;
        document.getElementById('responseTime').textContent = `耗时 ${(elapsed / 1000).toFixed(1)}s`;

        showNotification('指令发送成功', 'success');

      } catch (err) {
        document.getElementById('responseContent').textContent = '错误: ' + err.message;
        document.getElementById('responseSource').innerHTML = '<span class="response-source" style="background: rgba(239, 68, 68, 0.15); color: #ef4444;">失败</span>';
        showNotification('发送失败: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="send"></i> 发送指令';
        lucide.createIcons();
        updateSendButton();
      }
    }

    // 监听输入变化
    document.getElementById('promptInput').addEventListener('input', updateSendButton);

    // 启动
    init();
  </script>
</body>
</html>
